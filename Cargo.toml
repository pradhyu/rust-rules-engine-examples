[package]
name = "rust-rules-engine-examples"
version = "0.1.0"
edition = "2024"
authors = ["Pradhyumna Shrestha <pradhyumna@example.com>"]
description = "A flexible, explainable rules engine specification and implementation in Rust with merit-based immigration rule examples."
license = "MIT OR Apache-2.0"

[lib]
name = "rust_rules_engine"
path = "src/lib.rs"

[[bin]]
name = "rules-engine-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
thiserror = "2.0"
comfy-table = "7.1"
colored = "3.0"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = "0.3"

