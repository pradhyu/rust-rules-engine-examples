id: "canada_crs_express_entry"
name: "Comprehensive Ranking System (CRS) - Express Entry"
version: "2026.2"
total_points_cap: 1200
pass_mark_threshold: null

categories:
  core_human_capital:
    name: "core_human_capital"
    display_name: "Core / Human Capital Factors"
    max_points: 500
  spouse_factors:
    name: "spouse_factors"
    display_name: "Spouse / Common-Law Partner Factors"
    max_points: 40
  skill_transferability:
    name: "skill_transferability"
    display_name: "Skill Transferability Factors"
    max_points: 100
  additional_points:
    name: "additional_points"
    display_name: "Additional Factors"
    max_points: 600

rules:
  # =========================================================================
  # PHASE 1: FACT ENRICHMENT & INFERENCE (Salience 800)
  # =========================================================================
  - id: "infer_high_language_status"
    name: "Infer High First Language Status (CLB 9+ in all 4 abilities)"
    phase: "enrichment"
    priority: 800
    no_loop: true
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.language.first_official.clb_reading"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_writing"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_listening"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_speaking"
          op: "gte"
          value: 9
    actions:
      - type: "set_attribute"
        key: "computed.has_clb_9_plus"
        value: true
      - type: "add_tag"
        tag: "high_language_proficient"

  - id: "infer_moderate_language_status"
    name: "Infer Moderate First Language Status (CLB 7+ in all 4 abilities)"
    phase: "enrichment"
    priority: 790
    no_loop: true
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.language.first_official.clb_reading"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_writing"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_listening"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_speaking"
          op: "gte"
          value: 7
    actions:
      - type: "set_attribute"
        key: "computed.has_clb_7_plus"
        value: true

  # =========================================================================
  # PHASE 2: SCORING - CORE HUMAN CAPITAL (Single Applicant) (Salience 500)
  # =========================================================================
  - id: "crs_core_age_single"
    name: "Age Points (Single Applicant)"
    phase: "scoring"
    priority: 500
    activation_group: "age_scoring"
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.age"
          mapping:
            "18": 99
            "19": 105
            "20": 110
            "21": 110
            "22": 110
            "23": 110
            "24": 110
            "25": 110
            "26": 110
            "27": 110
            "28": 110
            "29": 110
            "30": 105
            "31": 99
            "32": 94
            "33": 88
            "34": 83
            "35": 77
            "36": 72
            "37": 66
            "38": 61
            "39": 55
            "40": 50
            "41": 39
            "42": 28
            "43": 17
            "44": 6
          default: 0
        reason: "Core Human Capital age points for single candidate."

  - id: "crs_core_education_single"
    name: "Education Points (Single Applicant)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.education.highest_degree"
          mapping:
            "doctorate": 150
            "master": 135
            "two_or_more": 128
            "bachelor": 120
            "three_year_post": 112
            "two_year_post": 98
            "one_year_post": 90
            "secondary": 30
          default: 0
        reason: "Core Human Capital education level points."

  - id: "crs_first_language_single"
    name: "First Official Language Points (Single Applicant)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "language_clb_band"
          reading_path: "applicant.language.first_official.clb_reading"
          writing_path: "applicant.language.first_official.clb_writing"
          listening_path: "applicant.language.first_official.clb_listening"
          speaking_path: "applicant.language.first_official.clb_speaking"
          band_scores:
            "10": 34
            "9": 31
            "8": 23
            "7": 17
            "6": 9
            "5": 6
            "4": 6
        reason: "Per-ability first language CLB scores (Max 34/ability)."

  - id: "crs_second_language_single"
    name: "Second Official Language Points (Single Applicant)"
    phase: "scoring"
    priority: 500
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.marital_status"
          op: "eq"
          value: "single"
        - type: "compare"
          path: "applicant.language.second_official"
          op: "exists"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "language_clb_band"
          reading_path: "applicant.language.second_official.clb_reading"
          writing_path: "applicant.language.second_official.clb_writing"
          listening_path: "applicant.language.second_official.clb_listening"
          speaking_path: "applicant.language.second_official.clb_speaking"
          band_scores:
            "10": 6
            "9": 6
            "8": 3
            "7": 3
            "6": 1
            "5": 1
        reason: "Per-ability second language CLB scores (Max 6/ability)."

  - id: "crs_canadian_experience_single"
    name: "Canadian Work Experience (Single Applicant)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.work_experience.domestic_years"
          mapping:
            "1": 40
            "2": 53
            "3": 64
            "4": 72
            "5": 80
            "6": 80
            "7": 80
          default: 0
        reason: "Canadian domestic work experience points."

  # =========================================================================
  # PHASE 2B: SCORING - CORE HUMAN CAPITAL & SPOUSE FACTORS (Married Applicant)
  # =========================================================================
  - id: "crs_core_age_married"
    name: "Age Points (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    activation_group: "age_scoring"
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.age"
          mapping:
            "18": 90
            "19": 95
            "20": 100
            "21": 100
            "22": 100
            "23": 100
            "24": 100
            "25": 100
            "26": 100
            "27": 100
            "28": 100
            "29": 100
            "30": 95
            "31": 90
            "32": 85
            "33": 80
            "34": 75
            "35": 70
            "36": 65
            "37": 60
            "38": 55
            "39": 50
            "40": 45
            "41": 35
            "42": 25
            "43": 15
            "44": 5
          default: 0
        reason: "Core Human Capital age points for candidate with spouse."

  - id: "crs_core_education_married"
    name: "Education Points (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.education.highest_degree"
          mapping:
            "doctorate": 140
            "master": 126
            "two_or_more": 119
            "bachelor": 112
            "three_year_post": 105
            "two_year_post": 91
            "one_year_post": 84
            "secondary": 28
          default: 0
        reason: "Core Human Capital education points with spouse."

  - id: "crs_first_language_married"
    name: "First Official Language Points (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "language_clb_band"
          reading_path: "applicant.language.first_official.clb_reading"
          writing_path: "applicant.language.first_official.clb_writing"
          listening_path: "applicant.language.first_official.clb_listening"
          speaking_path: "applicant.language.first_official.clb_speaking"
          band_scores:
            "10": 32
            "9": 29
            "8": 22
            "7": 16
            "6": 8
            "5": 5
            "4": 5
        reason: "Per-ability first language CLB scores with spouse (Max 32/ability, 128 total)."

  - id: "crs_canadian_experience_married"
    name: "Canadian Work Experience (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.work_experience.domestic_years"
          mapping:
            "1": 35
            "2": 46
            "3": 56
            "4": 63
            "5": 70
            "6": 70
            "7": 70
          default: 0
        reason: "Canadian domestic work experience points with spouse (Max 70 pts)."

  - id: "crs_spouse_education"
    name: "Spouse Education Level"
    phase: "scoring"
    priority: 480
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.marital_status"
          op: "in"
          value: ["married", "common_law"]
        - type: "compare"
          path: "applicant.spouse.education.highest_degree"
          op: "exists"
    actions:
      - type: "award_points"
        category: "spouse_factors"
        formula:
          type: "lookup"
          path: "applicant.spouse.education.highest_degree"
          mapping:
            "doctorate": 10
            "master": 10
            "two_or_more": 9
            "bachelor": 8
            "three_year_post": 7
            "two_year_post": 6
            "one_year_post": 5
            "secondary": 2
          default: 0
        reason: "Spouse education credentials points."

  - id: "crs_spouse_language"
    name: "Spouse Official Language Proficiency"
    phase: "scoring"
    priority: 480
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.marital_status"
          op: "in"
          value: ["married", "common_law"]
        - type: "compare"
          path: "applicant.spouse.language.first_official"
          op: "exists"
    actions:
      - type: "award_points"
        category: "spouse_factors"
        formula:
          type: "language_clb_band"
          reading_path: "applicant.spouse.language.first_official.clb_reading"
          writing_path: "applicant.spouse.language.first_official.clb_writing"
          listening_path: "applicant.spouse.language.first_official.clb_listening"
          speaking_path: "applicant.spouse.language.first_official.clb_speaking"
          band_scores:
            "10": 5
            "9": 5
            "8": 3
            "7": 3
            "6": 1
            "5": 1
        reason: "Spouse language proficiency points (Max 5/ability, 20 total)."

  # =========================================================================
  # PHASE 3: SCORING - SKILL TRANSFERABILITY COMBINATIONS (Salience 400)
  # =========================================================================
  - id: "crs_transferability_edu_clb9"
    name: "Skill Transferability: Post-Secondary Degree + CLB 9+"
    phase: "scoring"
    priority: 400
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.education.highest_degree"
          op: "in"
          value: ["two_or_more", "master", "doctorate"]
        - type: "compare"
          path: "computed.has_clb_9_plus"
          op: "eq"
          value: true
    actions:
      - type: "award_points"
        category: "skill_transferability"
        formula:
          type: "fixed"
          points: 50
        reason: "Higher degree combined with CLB 9+ in all 4 abilities."

  - id: "crs_transferability_foreign_work_clb9"
    name: "Skill Transferability: Foreign Work Experience (3+ yrs) + CLB 9+"
    phase: "scoring"
    priority: 400
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.work_experience.foreign_years"
          op: "gte"
          value: 3
        - type: "compare"
          path: "computed.has_clb_9_plus"
          op: "eq"
          value: true
    actions:
      - type: "award_points"
        category: "skill_transferability"
        formula:
          type: "fixed"
          points: 50
        reason: "3+ years foreign work experience combined with CLB 9+."

  - id: "crs_transferability_foreign_work_canadian"
    name: "Skill Transferability: Foreign Work Experience + Canadian Experience"
    phase: "scoring"
    priority: 400
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.work_experience.foreign_years"
          op: "gte"
          value: 3
        - type: "compare"
          path: "applicant.work_experience.domestic_years"
          op: "gte"
          value: 2
    actions:
      - type: "award_points"
        category: "skill_transferability"
        formula:
          type: "fixed"
          points: 50
        reason: "3+ years foreign work combined with 2+ years Canadian work experience."

  - id: "crs_transferability_trade_cert_clb7"
    name: "Skill Transferability: Certificate of Qualification in Trades + CLB 7+"
    phase: "scoring"
    priority: 400
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.work_experience.has_trade_certification"
          op: "eq"
          value: true
        - type: "compare"
          path: "computed.has_clb_7_plus"
          op: "eq"
          value: true
    actions:
      - type: "award_points"
        category: "skill_transferability"
        formula:
          type: "fixed"
          points: 50
        reason: "Provincial trade qualification certificate with CLB 7+."

  # =========================================================================
  # PHASE 4: ADDITIONAL BONUS FACTORS (Salience 300)
  # =========================================================================
  - id: "crs_bonus_provincial_nomination"
    name: "Provincial Nomination (+600 Points)"
    phase: "scoring"
    priority: 300
    condition:
      type: "compare"
      path: "applicant.additional_factors.provincial_nomination"
      op: "eq"
      value: true
    actions:
      - type: "award_points"
        category: "additional_points"
        formula:
          type: "fixed"
          points: 600
        reason: "Enhanced Provincial Nominee Program (PNP) nomination."

  - id: "crs_bonus_qualifying_job_offer"
    name: "Qualifying Arranged Employment / Job Offer (+50 Points)"
    phase: "scoring"
    priority: 300
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.job_offer.has_offer"
          op: "eq"
          value: true
        - type: "compare"
          path: "applicant.job_offer.is_lmia_approved_or_exempt"
          op: "eq"
          value: true
    actions:
      - type: "award_points"
        category: "additional_points"
        formula:
          type: "fixed"
          points: 50
        reason: "Valid LMIA-approved arranged employment offer (TEER 1/2/3)."

  - id: "crs_bonus_french_speaker"
    name: "Bilingual French & English Bonus (+50 Points)"
    phase: "scoring"
    priority: 300
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.additional_factors.french_speaker_bonus_eligible"
          op: "eq"
          value: true
        - type: "compare"
          path: "computed.has_clb_7_plus"
          op: "eq"
          value: true
    actions:
      - type: "award_points"
        category: "additional_points"
        formula:
          type: "fixed"
          points: 50
        reason: "Strong French speaker (NCLC 7+) with English proficiency."

  - id: "crs_bonus_sibling_in_canada"
    name: "Sibling in Canada (Citizen or PR) (+15 Points)"
    phase: "scoring"
    priority: 300
    condition:
      type: "compare"
      path: "applicant.additional_factors.has_sibling_citizen_or_pr"
      op: "eq"
      value: true
    actions:
      - type: "award_points"
        category: "additional_points"
        formula:
          type: "fixed"
          points: 15
        reason: "Brother or sister living in Canada who is a citizen or permanent resident."
