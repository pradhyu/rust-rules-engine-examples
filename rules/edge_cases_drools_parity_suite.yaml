id: "edge_cases_drools_parity_suite"
name: "Drools Feature Parity & Edge Case Verification Suite"
version: "1.0.0"
pass_mark_threshold: 60
total_points_cap: 1000

categories:
  gates:
    name: "gates"
    display_name: "Mandatory Eligibility Gates"
  enrichment:
    name: "enrichment"
    display_name: "Inference & Fact Enrichment"
  capped_bonus_category:
    name: "capped_bonus_category"
    display_name: "Capped Bonus Category"
    max_points: 100
  general_scoring:
    name: "general_scoring"
    display_name: "General Points Category"
    max_points: 500

rules:
  # =========================================================================
  # EDGE CASE 6 & 10: HARD ELIGIBILITY GATE (Salience 1000)
  # =========================================================================
  - id: "ec_06_hard_age_gate"
    name: "Edge Case 6: Hard Age Cutoff Gate"
    phase: "validation"
    priority: 1000
    is_eligibility_gate: true
    condition:
      type: "compare"
      path: "applicant.age"
      op: "gte"
      value: 45
    actions:
      - type: "set_eligibility"
        eligible: false
        reason: "Applicant aged 45+ is barred by mandatory age gate."

  # =========================================================================
  # EDGE CASE 7: TEMPORAL CEP EXPIRY WINDOW (Salience 950)
  # =========================================================================
  - id: "ec_07_temporal_language_validity"
    name: "Edge Case 7: Language Test Recency Window (Max 730 Days)"
    phase: "validation"
    priority: 950
    is_eligibility_gate: true
    condition:
      type: "compare"
      path: "applicant.language.test_age_days"
      op: "gt"
      value: 730
    actions:
      - type: "set_eligibility"
        eligible: false
        reason: "Language test expired (taken more than 730 days ago)."

  # =========================================================================
  # EDGE CASE 11: FORWARD CHAINING & FACT INFERENCE (Salience 800)
  # =========================================================================
  - id: "ec_11_infer_clb9_proficiency"
    name: "Edge Case 11: Forward Chaining Inference Rule"
    phase: "enrichment"
    priority: 800
    no_loop: true
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.language.first_official.clb_reading"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_writing"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_listening"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_speaking"
          op: "gte"
          value: 9
    actions:
      - type: "set_attribute"
        key: "computed.is_high_language_certified"
        value: true
      - type: "add_tag"
        tag: "inferred_clb9_mastery"

  # =========================================================================
  # EDGE CASE 10: UNIVERSAL QUANTIFIER (forall / all 4 abilities) (Salience 700)
  # =========================================================================
  - id: "ec_10_forall_language_floor"
    name: "Edge Case 10: Universal Quantifier (All 4 abilities >= CLB 7)"
    phase: "scoring"
    priority: 700
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.language.first_official.clb_reading"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_writing"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_listening"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_speaking"
          op: "gte"
          value: 7
    actions:
      - type: "award_points"
        category: "general_scoring"
        formula: { type: "fixed", points: 30 }
        reason: "Universal Quantifier: Passed CLB 7+ in all 4 language abilities."

  # =========================================================================
  # EDGE CASE 4: MULTI-FACT RELATIONAL JOIN (Salience 600)
  # =========================================================================
  - id: "ec_04_sponsor_relational_join"
    name: "Edge Case 4: Multi-Fact Relational Join"
    phase: "scoring"
    priority: 600
    is_eligibility_gate: true
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.job_offer.has_offer"
          op: "eq"
          value: true
        - type: "compare"
          path: "applicant.job_offer.sponsor.is_licensed"
          op: "eq"
          value: true
        - type: "compare"
          path: "applicant.job_offer.sponsor.license_rating"
          op: "eq"
          value: "A_rated"
    actions:
      - type: "award_points"
        category: "general_scoring"
        formula: { type: "fixed", points: 20 }
        reason: "Relational Join verified: Sponsor is active and A-rated."

  # =========================================================================
  # EDGE CASE 5: ACTIVATION GROUP MUTUAL EXCLUSION (XOR) (Salience 500)
  # =========================================================================
  - id: "ec_05_tradeable_option_a_high_salary"
    name: "Edge Case 5: Tradeable Option A (£42,000+ Salary)"
    phase: "scoring"
    priority: 500
    activation_group: "tradeable_selection"
    condition:
      type: "compare"
      path: "applicant.job_offer.annual_salary"
      op: "gte"
      value: 42000.00
    actions:
      - type: "award_points"
        category: "general_scoring"
        formula: { type: "fixed", points: 20 }
        reason: "Activation Group Option A fired (Higher priority salary match)."

  - id: "ec_05_tradeable_option_b_stem_phd"
    name: "Edge Case 5: Tradeable Option B (STEM PhD Pathway)"
    phase: "scoring"
    priority: 450
    activation_group: "tradeable_selection"
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.education.highest_degree"
          op: "eq"
          value: "doctorate"
        - type: "compare"
          path: "applicant.education.is_stem"
          op: "eq"
          value: true
    actions:
      - type: "award_points"
        category: "general_scoring"
        formula: { type: "fixed", points: 20 }
        reason: "Activation Group Option B fired (STEM PhD)."

  # =========================================================================
  # EDGE CASE 8: THREE-VALUED LOGIC & NULL-SAFE TRAVERSAL (Salience 400)
  # =========================================================================
  - id: "ec_08_null_safe_spouse_evaluation"
    name: "Edge Case 8: Null-Safe Spouse Assessment"
    phase: "scoring"
    priority: 400
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.marital_status"
          op: "in"
          value: ["married", "common_law"]
        - type: "compare"
          path: "applicant.spouse.education.highest_degree"
          op: "exists"
    actions:
      - type: "award_points"
        category: "general_scoring"
        formula:
          type: "lookup"
          path: "applicant.spouse.education.highest_degree"
          mapping:
            "doctorate": 10
            "master": 10
            "bachelor": 8
          default: 0
        reason: "Null-safe spouse education scoring."

  # =========================================================================
  # EDGE CASE 3: SUBCATEGORY CAPPING OVERFLOW (Salience 300)
  # =========================================================================
  - id: "ec_03_cap_overflow_subrule_1"
    name: "Edge Case 3: Cap Overflow Sub-rule 1 (+50)"
    phase: "scoring"
    priority: 300
    condition:
      type: "compare"
      path: "applicant.education.highest_degree"
      op: "in"
      value: ["bachelor", "master", "doctorate"]
    actions:
      - type: "award_points"
        category: "capped_bonus_category"
        formula: { type: "fixed", points: 50 }
        reason: "Bonus sub-rule 1 (Max category budget 100)."

  - id: "ec_03_cap_overflow_subrule_2"
    name: "Edge Case 3: Cap Overflow Sub-rule 2 (+50)"
    phase: "scoring"
    priority: 300
    condition:
      type: "compare"
      path: "applicant.work_experience.foreign_years"
      op: "gte"
      value: 3
    actions:
      - type: "award_points"
        category: "capped_bonus_category"
        formula: { type: "fixed", points: 50 }
        reason: "Bonus sub-rule 2."

  - id: "ec_03_cap_overflow_subrule_3"
    name: "Edge Case 3: Cap Overflow Sub-rule 3 (+50)"
    phase: "scoring"
    priority: 300
    condition:
      type: "compare"
      path: "applicant.work_experience.has_trade_certification"
      op: "eq"
      value: true
    actions:
      - type: "award_points"
        category: "capped_bonus_category"
        formula: { type: "fixed", points: 50 }
        reason: "Bonus sub-rule 3 (Pushes raw sum to 150 -> clamped to 100)."

  # =========================================================================
  # DOWNSTREAM FIRING FROM INFERRED FACT (Salience 200)
  # =========================================================================
  - id: "ec_11_downstream_transferability_fire"
    name: "Edge Case 11: Downstream Rule Fired by Inferred Fact"
    phase: "scoring"
    priority: 200
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "computed.is_high_language_certified"
          op: "eq"
          value: true
        - type: "compare"
          path: "applicant.education.highest_degree"
          op: "in"
          value: ["master", "doctorate"]
    actions:
      - type: "award_points"
        category: "general_scoring"
        formula: { type: "fixed", points: 50 }
        reason: "Downstream transferability awarded via inferred high language fact."
