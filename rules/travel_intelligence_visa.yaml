id: travel_intelligence_visa_assessment
name: "Global Travel Intelligence Visa Assessment"
version: "2.0.0"
description: "Global Travel Intelligence Visa Assessment with multi-layer inferencing"
categories:
  travel_profile:
    name: "travel_profile"
    display_name: "Travel Profile Score"
    max_points: 100
  compliance:
    name: "compliance"
    display_name: "Compliance & Risk Score"
    max_points: 50
  bonus:
    name: "bonus"
    display_name: "Decision Bonus"
    max_points: 100
  visa_tier:
    name: "visa_tier"
    display_name: "Visa Tier Score"
    max_points: 50
total_points_cap: 300
pass_mark_threshold: 67
rules:
  # LAYER 1 - ENRICHMENT PHASE
  - id: tiv_enrich_sanctioned_visits
    name: "Enrich Sanctioned Visits"
    description: "Accumulate count of visits to sanctioned countries"
    phase: enrichment
    priority: 900
    enabled: true
    condition:
      type: always
    actions:
      - type: accumulate
        source_array: applicant.travel_history
        filter:
          type: compare
          path: country_code
          op: in
          value: ["IR", "KP", "SY", "CU", "VE"]
        function: count
        target_attribute: computed.sanctioned_visit_count

  - id: tiv_enrich_overstay_count
    name: "Enrich Overstay Count"
    description: "Accumulate count of travel entries where overstay_days > 0"
    phase: enrichment
    priority: 900
    enabled: true
    condition:
      type: always
    actions:
      - type: accumulate
        source_array: applicant.travel_history
        filter:
          type: compare
          path: overstay_days
          op: gt
          value: 0
        function: count
        target_attribute: computed.overstay_count

  - id: tiv_enrich_total_countries
    name: "Enrich Total Countries"
    description: "Accumulate count of ALL entries"
    phase: enrichment
    priority: 900
    enabled: true
    condition:
      type: always
    actions:
      - type: accumulate
        source_array: applicant.travel_history
        function: count
        target_attribute: computed.total_trip_count

  - id: tiv_enrich_schengen_days
    name: "Enrich Schengen Days"
    description: "Accumulate sum of duration_days for entries where region == 'schengen'"
    phase: enrichment
    priority: 900
    enabled: true
    condition:
      type: always
    actions:
      - type: accumulate
        source_array: applicant.travel_history
        filter:
          type: compare
          path: region
          op: eq
          value: "schengen"
        function: sum
        field: duration_days
        target_attribute: computed.total_schengen_days

  - id: tiv_enrich_five_eyes_visits
    name: "Enrich Five Eyes Visits"
    description: "Accumulate count where country_code IN Five Eyes"
    phase: enrichment
    priority: 900
    enabled: true
    condition:
      type: always
    actions:
      - type: accumulate
        source_array: applicant.travel_history
        filter:
          type: compare
          path: country_code
          op: in
          value: ["US", "GB", "CA", "AU", "NZ"]
        function: count
        target_attribute: computed.five_eyes_visit_count

  - id: tiv_enrich_conflict_zone_visits
    name: "Enrich Conflict Zone Visits"
    description: "Accumulate count where country_code IN conflict zones"
    phase: enrichment
    priority: 900
    enabled: true
    condition:
      type: always
    actions:
      - type: accumulate
        source_array: applicant.travel_history
        filter:
          type: compare
          path: country_code
          op: in
          value: ["AF", "IQ", "LY", "SO", "YE", "UA"]
        function: count
        target_attribute: computed.conflict_zone_count

  # LAYER 2 - SCORING PHASE
  - id: tiv_score_travel_breadth_200
    name: "Score Travel Breadth >= 200"
    description: "Score travel breadth 200+"
    phase: scoring
    priority: 730
    activation_group: travel_breadth_band
    enabled: true
    condition:
      type: compare
      path: computed.total_trip_count
      op: gte
      value: 200
    actions:
      - type: award_points
        category: travel_profile
        formula:
          type: fixed
          points: 75

  - id: tiv_score_travel_breadth_100
    name: "Score Travel Breadth >= 100"
    description: "Score travel breadth 100+"
    phase: scoring
    priority: 720
    activation_group: travel_breadth_band
    enabled: true
    condition:
      type: compare
      path: computed.total_trip_count
      op: gte
      value: 100
    actions:
      - type: award_points
        category: travel_profile
        formula:
          type: fixed
          points: 50

  - id: tiv_score_travel_breadth_50
    name: "Score Travel Breadth >= 50"
    description: "Score travel breadth 50+"
    phase: scoring
    priority: 710
    activation_group: travel_breadth_band
    enabled: true
    condition:
      type: compare
      path: computed.total_trip_count
      op: gte
      value: 50
    actions:
      - type: award_points
        category: travel_profile
        formula:
          type: fixed
          points: 30

  - id: tiv_score_five_eyes_familiarity
    name: "Score Five Eyes Familiarity"
    description: "Score 25 points if Five Eyes >= 5"
    phase: scoring
    priority: 700
    enabled: true
    condition:
      type: compare
      path: computed.five_eyes_visit_count
      op: gte
      value: 5
    actions:
      - type: award_points
        category: compliance
        formula:
          type: fixed
          points: 25
      - type: set_attribute
        key: computed.five_eyes_trusted
        value: true

  - id: tiv_score_compliance_clean
    name: "Score Compliance Clean"
    description: "Clean compliance record"
    phase: scoring
    priority: 710
    activation_group: compliance_level
    enabled: true
    condition:
      type: all
      conditions:
        - type: compare
          path: computed.overstay_count
          op: eq
          value: 0
        - type: compare
          path: computed.sanctioned_visit_count
          op: eq
          value: 0
    actions:
      - type: award_points
        category: compliance
        formula:
          type: fixed
          points: 50
      - type: set_attribute
        key: computed.compliance_risk_level
        value: "low"

  - id: tiv_score_compliance_moderate
    name: "Score Compliance Moderate"
    description: "Moderate compliance risk"
    phase: scoring
    priority: 700
    activation_group: compliance_level
    enabled: true
    condition:
      type: all
      conditions:
        - type: compare
          path: computed.overstay_count
          op: between
          value: [1, 3]
        - type: compare
          path: computed.sanctioned_visit_count
          op: eq
          value: 0
    actions:
      - type: award_points
        category: compliance
        formula:
          type: fixed
          points: 20
      - type: set_attribute
        key: computed.compliance_risk_level
        value: "moderate"

  - id: tiv_score_compliance_high
    name: "Score Compliance High"
    description: "High compliance risk"
    phase: scoring
    priority: 690
    activation_group: compliance_level
    enabled: true
    condition:
      type: any
      conditions:
        - type: compare
          path: computed.overstay_count
          op: gt
          value: 3
        - type: compare
          path: computed.sanctioned_visit_count
          op: gt
          value: 0
    actions:
      - type: award_points
        category: compliance
        formula:
          type: fixed
          points: 0
      - type: set_attribute
        key: computed.compliance_risk_level
        value: "high"

  - id: tiv_score_schengen_overstay_risk
    name: "Score Schengen Overstay Risk"
    description: "Flag if Schengen days > 180"
    phase: scoring
    priority: 700
    enabled: true
    condition:
      type: compare
      path: computed.total_schengen_days
      op: gt
      value: 180
    actions:
      - type: set_attribute
        key: computed.schengen_overstay_flag
        value: true
      - type: add_tag
        tag: "schengen_180_exceeded"

  - id: tiv_score_conflict_exposure
    name: "Score Conflict Exposure"
    description: "Flag if conflict zone visits >= 3"
    phase: scoring
    priority: 700
    enabled: true
    condition:
      type: compare
      path: computed.conflict_zone_count
      op: gte
      value: 3
    actions:
      - type: set_attribute
        key: computed.security_review_required
        value: true
      - type: add_tag
        tag: "conflict_zone_exposure"

  # LAYER 3 - CAPPING PHASE
  - id: tiv_cap_auto_approve
    name: "Cap Auto Approve"
    description: "Fast track auto approval"
    phase: capping
    priority: 510
    activation_group: final_decision
    enabled: true
    condition:
      type: all
      conditions:
        - type: compare
          path: computed.compliance_risk_level
          op: eq
          value: "low"
        - type: compare
          path: computed.five_eyes_trusted
          op: eq
          value: true
        - type: not
          condition:
            type: compare
            path: computed.security_review_required
            op: eq
            value: true
    actions:
      - type: set_attribute
        key: computed.decision
        value: "auto_approve"
      - type: add_tag
        tag: "fast_track"
      - type: award_points
        category: bonus
        formula:
          type: fixed
          points: 100

  - id: tiv_cap_manual_review
    name: "Cap Manual Review"
    description: "Requires manual interview"
    phase: capping
    priority: 500
    activation_group: final_decision
    enabled: true
    condition:
      type: any
      conditions:
        - type: compare
          path: computed.compliance_risk_level
          op: eq
          value: "moderate"
        - type: compare
          path: computed.security_review_required
          op: eq
          value: true
    actions:
      - type: set_attribute
        key: computed.decision
        value: "manual_review"
      - type: add_tag
        tag: "requires_interview"

  - id: tiv_cap_auto_deny
    name: "Cap Auto Deny"
    description: "High compliance risk auto deny"
    phase: capping
    priority: 520
    activation_group: final_decision
    enabled: true
    condition:
      type: all
      conditions:
        - type: compare
          path: computed.compliance_risk_level
          op: eq
          value: "high"
        - type: compare
          path: computed.schengen_overstay_flag
          op: eq
          value: true
    actions:
      - type: set_eligibility
        eligible: false
        reason: "Applicant flagged for high compliance risk with Schengen overstay"

  # LAYER 4 - VERDICT PHASE
  - id: tiv_verdict_premium_visa
    name: "Verdict Premium Visa"
    description: "Premium multi entry visa"
    phase: verdict
    priority: 310
    activation_group: visa_tier_assignment
    enabled: true
    condition:
      type: all
      conditions:
        - type: compare
          path: computed.decision
          op: eq
          value: "auto_approve"
        - type: compare
          path: computed.total_trip_count
          op: gte
          value: 100
    actions:
      - type: award_points
        category: visa_tier
        formula:
          type: fixed
          points: 50
      - type: set_attribute
        key: computed.visa_duration_years
        value: 10
      - type: add_tag
        tag: "premium_multi_entry"

  - id: tiv_verdict_standard_visa
    name: "Verdict Standard Visa"
    description: "Standard visa"
    phase: verdict
    priority: 300
    activation_group: visa_tier_assignment
    enabled: true
    condition:
      type: all
      conditions:
        - type: compare
          path: computed.decision
          op: eq
          value: "auto_approve"
        - type: compare
          path: computed.total_trip_count
          op: lt
          value: 100
    actions:
      - type: award_points
        category: visa_tier
        formula:
          type: fixed
          points: 25
      - type: set_attribute
        key: computed.visa_duration_years
        value: 5

  - id: tiv_verdict_restricted_visa
    name: "Verdict Restricted Visa"
    description: "Restricted single entry visa"
    phase: verdict
    priority: 300
    activation_group: visa_tier_assignment
    enabled: true
    condition:
      type: compare
      path: computed.decision
      op: eq
      value: "manual_review"
    actions:
      - type: award_points
        category: visa_tier
        formula:
          type: fixed
          points: 10
      - type: set_attribute
        key: computed.visa_duration_years
        value: 1
      - type: add_tag
        tag: "single_entry_only"
