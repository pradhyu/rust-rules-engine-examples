id: "australia_gsm_189"
name: "Australia General Skilled Migration (Subclass 189 Points Test)"
version: "2026.1"
pass_mark_threshold: 65

categories:
  core_points:
    name: "core_points"
    display_name: "Core Skills & Human Capital"
    max_points: 100
  partner_points:
    name: "partner_points"
    display_name: "Partner Skills & Single Status"
    max_points: 10
  nomination_points:
    name: "nomination_points"
    display_name: "State / Regional Nomination"
    max_points: 15

rules:
  # =========================================================================
  # PHASE 1: HARD ELIGIBILITY GATES
  # =========================================================================
  - id: "aus_gate_age_under_45"
    name: "Mandatory Age Gate (Under 45 Years Old)"
    phase: "validation"
    priority: 1000
    is_eligibility_gate: true
    condition:
      type: "compare"
      path: "applicant.age"
      op: "lt"
      value: 45
    actions:
      - type: "set_eligibility"
        eligible: true
        reason: "Applicant meets the mandatory under-45 age requirement."

  - id: "aus_gate_age_45_plus_reject"
    name: "Age 45 or Older Hard Rejection"
    phase: "validation"
    priority: 1000
    is_eligibility_gate: true
    condition:
      type: "compare"
      path: "applicant.age"
      op: "gte"
      value: 45
    actions:
      - type: "set_eligibility"
        eligible: false
        reason: "Applicants aged 45 and over are ineligible for Subclass 189 General Skilled Migration."

  # =========================================================================
  # PHASE 2: SCORING - AGE BRACKETS (Activation Group)
  # =========================================================================
  - id: "aus_age_bracket_25_32"
    name: "Age 25–32 (30 Points)"
    phase: "scoring"
    priority: 500
    activation_group: "aus_age_group"
    condition:
      type: "compare"
      path: "applicant.age"
      op: "between"
      value: [25, 32]
    actions:
      - type: "award_points"
        category: "core_points"
        formula: { type: "fixed", points: 30 }
        reason: "Peak age bracket 25–32."

  - id: "aus_age_bracket_18_24"
    name: "Age 18–24 (25 Points)"
    phase: "scoring"
    priority: 500
    activation_group: "aus_age_group"
    condition:
      type: "compare"
      path: "applicant.age"
      op: "between"
      value: [18, 24]
    actions:
      - type: "award_points"
        category: "core_points"
        formula: { type: "fixed", points: 25 }
        reason: "Age bracket 18–24."

  - id: "aus_age_bracket_33_39"
    name: "Age 33–39 (25 Points)"
    phase: "scoring"
    priority: 500
    activation_group: "aus_age_group"
    condition:
      type: "compare"
      path: "applicant.age"
      op: "between"
      value: [33, 39]
    actions:
      - type: "award_points"
        category: "core_points"
        formula: { type: "fixed", points: 25 }
        reason: "Age bracket 33–39."

  - id: "aus_age_bracket_40_44"
    name: "Age 40–44 (15 Points)"
    phase: "scoring"
    priority: 500
    activation_group: "aus_age_group"
    condition:
      type: "compare"
      path: "applicant.age"
      op: "between"
      value: [40, 44]
    actions:
      - type: "award_points"
        category: "core_points"
        formula: { type: "fixed", points: 15 }
        reason: "Age bracket 40–44."

  # =========================================================================
  # PHASE 3: SCORING - ENGLISH PROFICIENCY (Activation Group)
  # =========================================================================
  - id: "aus_english_superior"
    name: "Superior English (20 Points - IELTS 8+ / PTE 79+)"
    phase: "scoring"
    priority: 450
    activation_group: "aus_english_group"
    condition:
      type: "compare"
      path: "applicant.language.english_tier"
      op: "eq"
      value: "superior"
    actions:
      - type: "award_points"
        category: "core_points"
        formula: { type: "fixed", points: 20 }
        reason: "Superior English proficiency."

  - id: "aus_english_proficient"
    name: "Proficient English (10 Points - IELTS 7+ / PTE 65+)"
    phase: "scoring"
    priority: 450
    activation_group: "aus_english_group"
    condition:
      type: "compare"
      path: "applicant.language.english_tier"
      op: "eq"
      value: "proficient"
    actions:
      - type: "award_points"
        category: "core_points"
        formula: { type: "fixed", points: 10 }
        reason: "Proficient English proficiency."

  # =========================================================================
  # PHASE 4: SCORING - EDUCATION & STEM RESEARCH
  # =========================================================================
  - id: "aus_education_points"
    name: "Educational Qualifications"
    phase: "scoring"
    priority: 400
    condition:
      type: "compare"
      path: "applicant.education.highest_degree"
      op: "exists"
    actions:
      - type: "award_points"
        category: "core_points"
        formula:
          type: "lookup"
          path: "applicant.education.highest_degree"
          mapping:
            "doctorate": 20
            "master": 15
            "bachelor": 15
            "diploma": 10
            "trade": 10
          default: 0
        reason: "Recognized educational qualification."

  - id: "aus_stem_specialist"
    name: "STEM Specialist Educational Qualification (+10 Points)"
    phase: "scoring"
    priority: 390
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.education.is_stem_research"
          op: "eq"
          value: true
        - type: "compare"
          path: "applicant.education.highest_degree"
          op: "in"
          value: ["master", "doctorate"]
    actions:
      - type: "award_points"
        category: "core_points"
        formula: { type: "fixed", points: 10 }
        reason: "Postgraduate STEM research degree in designated field."

  # =========================================================================
  # PHASE 5: SCORING - OVERSEAS SKILLED EMPLOYMENT
  # =========================================================================
  - id: "aus_overseas_work_experience"
    name: "Overseas Skilled Employment (Past 10 Years)"
    phase: "scoring"
    priority: 350
    condition:
      type: "compare"
      path: "applicant.work_experience.foreign_years"
      op: "gte"
      value: 3
    actions:
      - type: "award_points"
        category: "core_points"
        formula:
          type: "lookup"
          path: "applicant.work_experience.foreign_years"
          mapping:
            "3": 5
            "4": 5
            "5": 10
            "6": 10
            "7": 10
            "8": 15
            "9": 15
            "10": 15
          default: 0
        reason: "Overseas skilled employment experience."

  # =========================================================================
  # PHASE 6: SCORING - PARTNER SKILLS / SINGLE STATUS
  # =========================================================================
  - id: "aus_partner_single_or_citizen"
    name: "Single Applicant or Partner is Citizen/PR (+10 Points)"
    phase: "scoring"
    priority: 300
    activation_group: "aus_partner_group"
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "partner_points"
        formula: { type: "fixed", points: 10 }
        reason: "Single applicant bonus."

  - id: "aus_partner_skilled"
    name: "Partner with Competent English and Skills Assessment (+10 Points)"
    phase: "scoring"
    priority: 300
    activation_group: "aus_partner_group"
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.marital_status"
          op: "in"
          value: ["married", "common_law"]
        - type: "compare"
          path: "applicant.spouse.has_positive_skills_assessment"
          op: "eq"
          value: true
        - type: "compare"
          path: "applicant.spouse.english_competent"
          op: "eq"
          value: true
    actions:
      - type: "award_points"
        category: "partner_points"
        formula: { type: "fixed", points: 10 }
        reason: "Spouse with positive skills assessment and competent English."
