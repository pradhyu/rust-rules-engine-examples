rules:
  # Age Points (Single)
  - id: "crs_core_age_single"
    name: "Age Points (Single Applicant)"
    phase: "scoring"
    priority: 500
    activation_group: "age_scoring"
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.age"
          mapping:
            "18": 99
            "19": 105
            "20": 110
            "21": 110
            "22": 110
            "23": 110
            "24": 110
            "25": 110
            "26": 110
            "27": 110
            "28": 110
            "29": 110
            "30": 105
            "31": 99
            "32": 94
            "33": 88
            "34": 83
            "35": 77
            "36": 72
            "37": 66
            "38": 61
            "39": 55
            "40": 50
            "41": 39
            "42": 28
            "43": 17
            "44": 6
          default: 0
        reason: "Core Human Capital age points for single candidate."

  # Age Points (Married)
  - id: "crs_core_age_married"
    name: "Age Points (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    activation_group: "age_scoring"
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.age"
          mapping:
            "18": 90
            "19": 95
            "20": 100
            "21": 100
            "22": 100
            "23": 100
            "24": 100
            "25": 100
            "26": 100
            "27": 100
            "28": 100
            "29": 100
            "30": 95
            "31": 90
            "32": 85
            "33": 80
            "34": 75
            "35": 70
            "36": 65
            "37": 60
            "38": 55
            "39": 50
            "40": 45
            "41": 35
            "42": 25
            "43": 15
            "44": 5
          default: 0
        reason: "Core Human Capital age points for candidate with spouse."

  # Education (Single)
  - id: "crs_core_education_single"
    name: "Education Points (Single Applicant)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.education.highest_degree"
          mapping:
            "doctorate": 150
            "master": 135
            "two_or_more": 128
            "bachelor": 120
            "three_year_post": 112
            "two_year_post": 98
            "one_year_post": 90
            "secondary": 30
          default: 0
        reason: "Core Human Capital education level points."

  # Education (Married)
  - id: "crs_core_education_married"
    name: "Education Points (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.education.highest_degree"
          mapping:
            "doctorate": 140
            "master": 126
            "two_or_more": 119
            "bachelor": 112
            "three_year_post": 105
            "two_year_post": 91
            "one_year_post": 84
            "secondary": 28
          default: 0
        reason: "Core Human Capital education points with spouse."

  # First Language (Single)
  - id: "crs_first_language_single"
    name: "First Official Language Points (Single Applicant)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "language_clb_band"
          reading_path: "applicant.language.first_official.clb_reading"
          writing_path: "applicant.language.first_official.clb_writing"
          listening_path: "applicant.language.first_official.clb_listening"
          speaking_path: "applicant.language.first_official.clb_speaking"
          band_scores:
            "10": 34
            "9": 31
            "8": 23
            "7": 17
            "6": 9
            "5": 6
            "4": 6
        reason: "Per-ability first language CLB scores (Max 34/ability)."

  # First Language (Married)
  - id: "crs_first_language_married"
    name: "First Official Language Points (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "language_clb_band"
          reading_path: "applicant.language.first_official.clb_reading"
          writing_path: "applicant.language.first_official.clb_writing"
          listening_path: "applicant.language.first_official.clb_listening"
          speaking_path: "applicant.language.first_official.clb_speaking"
          band_scores:
            "10": 32
            "9": 29
            "8": 22
            "7": 16
            "6": 8
            "5": 5
            "4": 5
        reason: "Per-ability first language CLB scores with spouse (Max 32/ability, 128 total)."

  # Canadian Experience (Single)
  - id: "crs_canadian_experience_single"
    name: "Canadian Work Experience (Single Applicant)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "eq"
      value: "single"
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.work_experience.domestic_years"
          mapping:
            "1": 40
            "2": 53
            "3": 64
            "4": 72
            "5": 80
            "6": 80
            "7": 80
          default: 0
        reason: "Canadian domestic work experience points."

  # Canadian Experience (Married)
  - id: "crs_canadian_experience_married"
    name: "Canadian Work Experience (Married Applicant with Spouse)"
    phase: "scoring"
    priority: 500
    condition:
      type: "compare"
      path: "applicant.marital_status"
      op: "in"
      value: ["married", "common_law"]
    actions:
      - type: "award_points"
        category: "core_human_capital"
        formula:
          type: "lookup"
          path: "applicant.work_experience.domestic_years"
          mapping:
            "1": 35
            "2": 46
            "3": 56
            "4": 63
            "5": 70
            "6": 70
            "7": 70
          default: 0
        reason: "Canadian domestic work experience points with spouse (Max 70 pts)."
