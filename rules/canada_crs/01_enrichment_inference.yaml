rules:
  - id: "infer_high_language_status"
    name: "Infer High First Language Status (CLB 9+ in all 4 abilities)"
    phase: "enrichment"
    priority: 800
    no_loop: true
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.language.first_official.clb_reading"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_writing"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_listening"
          op: "gte"
          value: 9
        - type: "compare"
          path: "applicant.language.first_official.clb_speaking"
          op: "gte"
          value: 9
    actions:
      - type: "set_attribute"
        key: "computed.has_clb_9_plus"
        value: true
      - type: "add_tag"
        tag: "high_language_proficient"

  - id: "infer_moderate_language_status"
    name: "Infer Moderate First Language Status (CLB 7+ in all 4 abilities)"
    phase: "enrichment"
    priority: 790
    no_loop: true
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.language.first_official.clb_reading"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_writing"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_listening"
          op: "gte"
          value: 7
        - type: "compare"
          path: "applicant.language.first_official.clb_speaking"
          op: "gte"
          value: 7
    actions:
      - type: "set_attribute"
        key: "computed.has_clb_7_plus"
        value: true
