rules:
  - id: "uk_tradeable_option_b_stem_phd"
    name: "Option B: Relevant STEM PhD and Salary >= £30,960"
    description: "Doctorate in STEM discipline with discounted salary threshold"
    phase: "scoring"
    category: "tradeable_criteria"
    priority: 450
    activation_group: "uk_tradeable_points"
    condition:
      type: "all"
      conditions:
        - type: "compare"
          path: "applicant.education.highest_degree"
          op: "eq"
          value: "doctorate"
        - type: "compare"
          path: "applicant.education.is_stem"
          op: "eq"
          value: true
        - type: "compare"
          path: "applicant.job_offer.annual_salary"
          op: "gte"
          value: 30960.00
    actions:
      - type: "award_points"
        category: "tradeable_criteria"
        formula:
          type: "fixed"
          points: 20.0
        reason: "Tradeable Option B: STEM Doctorate Discounted Threshold (£30,960+) Met (+20 pts)"
